name = "portside"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Created by `npm run db:create`. Swap database_id for the real one that
# command prints out. Until then, local dev still works fine against a
# i
# local database using this same binding.
[[d1_databases]]
binding = "DB"
database_name = "portside"
database_id = "d327fc04-bb09-475d-94b2-51396636bca8"

# JWT_SECRET, STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are secrets, not
# vars - for local dev they go in .dev.vars (see .dev.vars.example), and for
# the deployed site they're set with:
#   npx wrangler pages secret put JWT_SECRET
#   npx wrangler pages secret put STRIPE_SECRET_KEY
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET
